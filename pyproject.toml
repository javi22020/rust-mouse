[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "rust-mouse"
description = "Realistic, human-like mouse movement for Python, powered by Rust."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "javi22020", email = "90896750+javi22020@users.noreply.github.com" }]
keywords = ["mouse", "automation", "human", "bezier", "rust", "input", "cursor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/javi22020/rust-mouse"
Repository = "https://github.com/javi22020/rust-mouse"
Issues = "https://github.com/javi22020/rust-mouse/issues"
